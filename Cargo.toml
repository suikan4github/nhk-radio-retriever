[package]
name = "nhk-radio-retriever"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "らじるらじる聞き逃し配信保存ソフト"

[dependencies]
# コマンドライン解析
clap = { version = "4.x", features = ["derive"] }
clap_complete = "4.x"

# 同期的なファイル取得
reqwest = {version = "0.12", features=["blocking"]}

# JSONのデシリアライズ処理用クレート
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[package.metadata.deb]
revision = "2"
maintainer = "HORIE Seiichi"
copyright = "HORIE Seiichi"
section = "utils"
priority = "optional"
depends = "$auto, s-nail | bsd-mailx | mailutils, util-linux, gstreamer1.0-tools, gstreamer1.0-plugins-bad"
maintainer-scripts = "deb/maintainer-scripts"
systemd-units = { unit-scripts = "deb", enable = true, start = false }
assets = [
    ["target/release/nhk-radio-retriever", "usr/bin/", "755"],
    ["deb/push-to-cloud.sh", "usr/bin/nhk-radio-push-to-cloud", "755"],
    ["deb/nhk-radio-retriever.default", "etc/default/nhk-radio-retriever", "644"],
]
conf-files = ["/etc/default/nhk-radio-retriever"]
